<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Voxel Engine (Beta Minecraft Clone)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif;}
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            width: 10px; height: 10px; background: white;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #ui {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <h3>Mini Voxel Clone</h3>
        <p>Click screen to lock mouse cursor.</p>
        <p><strong>Left Click:</strong> Place Block | <strong>Shift + Left Click:</strong> Break Block</p>
    </div>

    <!-- Import Three.js Engine and PointerLockControls from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 1. Setup Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky Blue
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(16, 5, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Setup Pointer Lock Controls (First Person Mouse Camera view)
        const controls = new PointerLockControls(camera, document.body);
        document.body.addEventListener('click', () => controls.lock());

        // 3. Add Ambient and Directional Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(20, 40, 20);
        scene.add(sunLight);

        // 4. Create Block Texture Arrays (Using InstancedMesh for performance)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshLambertMaterial({ color: 0x557a2b }); // Classic Grass Green
        
        // Generate a small 32x32 landscape grid layer
        const worldSize = 32;
        const instancedMesh = new THREE.InstancedMesh(geometry, material, worldSize * worldSize);
        let instanceIdx = 0;
        const dummy = new THREE.Object3D();

        for (let x = 0; x < worldSize; x++) {
            for (let z = 0; z < worldSize; z++) {
                dummy.position.set(x, 0, z);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(instanceIdx++, dummy.matrix);
            }
        }
        scene.add(instancedMesh);

        // 5. Block Interaction Logic (Raycasting)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(0, 0); // Center screen targeting

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (e.shiftKey) {
                    // Break block action mock
                    if(intersect.object !== instancedMesh) {
                        scene.remove(intersect.object);
                    }
                } else {
                    // Place new block action on face normal matrix
                    const blockMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b }); // Dirt Block
                    const newBlock = new THREE.Mesh(geometry, blockMat);
                    
                    const position = intersect.point.clone().add(intersect.face.normal.clone().multiplyScalar(0.5));
                    newBlock.position.set(Math.floor(position.x) + 0.5, Math.floor(position.y) + 0.5, Math.floor(position.z) + 0.5);
                    
                    scene.add(newBlock);
                }
            }
        });

        // 6. Basic Real-Time Animation Rendering Frame Loop
        function animate() {
            requestAnimationFrame(animate); // ~60fps target execution loop
            renderer.render(scene, camera);
        }
        animate();

        // Window resizing safety adjustment
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

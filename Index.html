<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Procedural Voxel Engine (Greenheck Architecture)</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Segoe UI', sans-serif; }
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            width: 12px; height: 12px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: white;
        }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }
        
        #ui {
            position: absolute; top: 15px; left: 15px; color: white;
            background: rgba(10, 10, 10, 0.75); padding: 15px; 
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none; max-width: 300px;
        }
        h3 { margin: 0 0 8px 0; color: #00e6ff; font-size: 16px; text-transform: uppercase; }
        p { margin: 4px 0; font-size: 13px; color: #ccc; }
        strong { color: #fff; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <h3>Voxel Engine Core</h3>
        <p>Click screen to capture mouse view.</p>
        <p><strong>WASD + Space:</strong> Move & Jump</p>
        <p><strong>Left Click:</strong> Place Target Block</p>
        <p><strong>Shift + Click:</strong> Destroy Target Block</p>
    </div>

    <!-- Import Map Configuration Targeting Three.js Module Core -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. Architectural Constants & Data Dictionary ---
        const BLOCK_SIZE = 1;
        const WORLD_WIDTH = 32;
        const WORLD_HEIGHT = 16;
        const WORLD_DEPTH = 32;

        const BLOCKS = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3
        };

        // Material color configuration index map
        const BLOCK_MATERIALS = {
            [BLOCKS.GRASS]: new THREE.MeshLambertMaterial({ color: 0x557a2b }),
            [BLOCKS.DIRT]: new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
            [BLOCKS.STONE]: new THREE.MeshLambertMaterial({ color: 0x737373 })
        };

        // --- 2. Structural Instantiations ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Start player safely floating above the initial generation layer
        camera.position.set(WORLD_WIDTH / 2, 10, WORLD_DEPTH / 2);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        document.body.addEventListener('click', () => controls.lock());

        // --- 3. Environmental Light Maps ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.75);
        sunLight.position.set(25, 50, 25);
        scene.add(sunLight);

        // --- 4. The World Data Model Array ---
        // A flat typed array representing [x][y][z] positions for performance optimization
        const worldData = new Uint8Array(WORLD_WIDTH * WORLD_HEIGHT * WORLD_DEPTH);

        function getBlockIndex(x, y, z) {
            return x + (y * WORLD_WIDTH) + (z * WORLD_WIDTH * WORLD_HEIGHT);
        }

        function getBlock(x, y, z) {
            if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT || z < 0 || z >= WORLD_DEPTH) return BLOCKS.AIR;
            return worldData[getBlockIndex(x, y, z)];
        }

        function setBlock(x, y, z, type) {
            if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT && z >= 0 && z < WORLD_DEPTH) {
                worldData[getBlockIndex(x, y, z)] = type;
            }
        }

        // --- 5. Generate Structural Terrain Model Data ---
        function generateTerrainData() {
            for (let x = 0; x < WORLD_WIDTH; x++) {
                for (let z = 0; z < WORLD_DEPTH; z++) {
                    // Simulating procedural variance mathematically
                    const heightValue = Math.floor(Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3) + 6;
                    
                    for (let y = 0; y < WORLD_HEIGHT; y++) {
                        if (y > heightValue) {
                            setBlock(x, y, z, BLOCKS.AIR);
                        } else if (y === heightValue) {
                            setBlock(x, y, z, BLOCKS.GRASS);
                        } else if (y > heightValue - 3) {
                            setBlock(x, y, z, BLOCKS.DIRT);
                        } else {
                            setBlock(x, y, z, BLOCKS.STONE);
                        }
                    }
                }
            }
        }
        generateTerrainData();

        // --- 6. Mesh Batched Geometry Instantiation Manager ---
        let instancedMeshes = {};
        const blockGeometry = new THREE.BoxGeometry(BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);

        function updateRenderMeshes() {
            // Remove previous generation mesh assets from operational visibility tracking
            Object.values(instancedMeshes).forEach(mesh => scene.remove(mesh));
            instancedMeshes = {};

            // Count occurrences to reserve memory boundaries correctly
            const counts = { [BLOCKS.GRASS]: 0, [BLOCKS.DIRT]: 0, [BLOCKS.STONE]: 0 };
            for (let i = 0; i < worldData.length; i++) {
                if (counts[worldData[i]] !== undefined) counts[worldData[i]]++;
            }

            // Allocate instanced meshes based on exact array block distributions
            Object.keys(counts).forEach(type => {
                if (counts[type] > 0) {
                    instancedMeshes[type] = new THREE.InstancedMesh(blockGeometry, BLOCK_MATERIALS[type], counts[type]);
                }
            });

            const trackers = { [BLOCKS.GRASS]: 0, [BLOCKS.DIRT]: 0, [BLOCKS.STONE]: 0 };
            const dummy = new THREE.Object3D();

            for (let x = 0; x < WORLD_WIDTH; x++) {
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    for (let z = 0; z < WORLD_DEPTH; z++) {
                        const blockType = getBlock(x, y, z);
                        if (blockType !== BLOCKS.AIR && instancedMeshes[blockType]) {
                            
                            // Check visibility: skip inner blocks to optimize rendering performance
                            const top = getBlock(x, y + 1, z);
                            const bottom = getBlock(x, y - 1, z);
                            const left = getBlock(x - 1, y, z);
                            const right = getBlock(x + 1, y, z);
                            const front = getBlock(x, y, z + 1);
                            const back = getBlock(x, y, z - 1);
                            
                            if (top && bottom && left && right && front && back) continue;

                            dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
                            dummy.updateMatrix();
                            instancedMeshes[blockType].setMatrixAt(trackers[blockType]++, dummy.matrix);
                        }
                    }
                }
            }

            // Sync structural changes directly to rendering memory buffers
            Object.values(instancedMeshes).forEach(mesh => {
                mesh.instanceMatrix.needsUpdate = true;
                scene.add(mesh);
            });
        }
        updateRenderMeshes();

        // --- 7. Player Navigation Controls & Basic Physics Loop ---
        const keysState = { w: false, a: false, s: false, d: false, space: false };
        const velocity = new THREE.Vector3();
        const playerRadius = 0.35;
        const playerHeight = 1.6;
        let isGrounded = false;

        window.addEventListener('keydown', (e) => handleKey(e.code, true));
        window.addEventListener('keyup', (e) => handleKey(e.code, false));

        function handleKey(code, isDown) {
            if (code === 'KeyW' || code === 'ArrowUp') keysState.w = isDown;
            if (code === 'KeyA' || code === 'ArrowLeft') keysState.a = isDown;
            if (code === 'KeyS' || code === 'ArrowDown') keysState.s = isDown;
            if (code === 'KeyD' || code === 'ArrowRight') keysState.d = isDown;
            if (code === 'Space') keysState.space = isDown;
        }

        // --- 8. Interactivity Engine (Raycasting Logic) ---
        const raycaster = new THREE.Raycaster();
        const centerTarget = new THREE.Vector2(0, 0);

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(centerTarget, camera);
            // Collect intersection maps from our active instanced structures
            const targets = Object.values(instancedMeshes);
            const intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0) {
Use code with caution.
const intersect = intersects[0];
// Determine precise spatial array alignment values
const point = intersect.point.clone();
const normal = intersect.face.normal.clone();
if (e.shiftKey) {
// Subtract half the normal vector to target the internal core coordinate
const blockPos = point.clone().sub(normal.clone().multiplyScalar(0.5));
setBlock(Math.floor(blockPos.x), Math.floor(blockPos.y), Math.floor(blockPos.z), BLOCKS.AIR);
} else {
// Add half the normal vector to target the adjacent air cell
const blockPos = point.clone().add(normal.clone().multiplyScalar(0.5));
setBlock(Math.floor(blockPos.x), Math.floor(blockPos.y), Math.floor(blockPos.z), BLOCKS.STONE);
}
updateRenderMeshes();
}
});
// --- 9. Real-Time Application Execution Tick ---
const clock = new THREE.Clock();
function animate() {
requestAnimationFrame(animate);
if (!controls.isLocked) {
renderer.render(scene, camera);
return;
}
const dt = Math.min(clock.getDelta(), 0.1); // Dynamic frame lag guard
// Apply gravity metrics across our vertical navigation channel
velocity.y -= 22.0 * dt;
// Extract directional forward/sideways reference headings from the active camera
const frontDirection = new THREE.Vector3();
camera.getWorldDirection(frontDirection);
frontDirection.y = 0;
frontDirection.normalize();
const sideDirection = new THREE.Vector3();
sideDirection.crossVectors(camera.up, frontDirection).normalize();
const moveVector = new THREE.Vector3();
if (keysState.w) moveVector.add(frontDirection);
if (keysState.s) moveVector.sub(frontDirection);
if (keysState.a) moveVector.add(sideDirection);
if (keysState.d) moveVector.sub(sideDirection);
moveVector.normalize().multiplyScalar(5.0); // Baseline movement velocity speed scale
velocity.x = moveVector.x;
velocity.z = moveVector.z;
// Apply displacement step checks to the camera axis positions
camera.position.x += velocity.x * dt;
camera.position.z += velocity.z * dt;
camera.position.y += velocity.y * dt;
// Basic Ground Y-Boundary Collision Map Logic
const checkX = Math.floor(camera.position.x);
const checkZ = Math.floor(camera.position.z);
const checkY = Math.floor(camera.position.y - playerHeight);
const standingBlock = getBlock(checkX, checkY, checkZ);
if (standingBlock !== BLOCKS.AIR) {
camera.position.y = checkY + 1 + playerHeight;
velocity.y = 0;
isGrounded = true;
} else {
isGrounded = false;
}
// Jump command processing mechanics
if (keysState.space && isGrounded) {
velocity.y = 7.5; // Jump vertical force impact scalar
isGrounded = false;
}
renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});

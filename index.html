<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#87bde8">
<title>Beta Blocks — Voxel Sandbox</title>
<style>
  :root {
    --ui: rgba(18,22,27,.82);
    --line: rgba(255,255,255,.28);
    --safe-bottom: env(safe-area-inset-bottom,0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #87bde8;
    touch-action: none;
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: #fff;
    text-shadow: 0 2px 3px #0008;
  }

  #fps {
    position: absolute;
    top: max(10px,env(safe-area-inset-top));
    left: 10px;
    padding: 7px 10px;
    border: 1px solid #ffffff38;
    border-radius: 9px;
    background: rgba(12,18,24,.62);
    font: 600 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing: .04em;
    backdrop-filter: blur(8px);
  }

  #status {
    position: absolute;
    top: max(10px,env(safe-area-inset-top));
    right: 10px;
    padding: 7px 10px;
    border-radius: 9px;
    background: rgba(12,18,24,.45);
    font-size: 11px;
    color: #f4f6f8;
  }

  #crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    transform: translate(-50%,-50%);
    opacity: .9;
  }

  #crosshair:before, #crosshair:after {
    content: "";
    position: absolute;
    background: white;
    box-shadow: 0 1px 2px #000;
  }

  #crosshair:before {
    width: 2px;
    height: 18px;
    left: 8px;
    top: 0;
  }

  #crosshair:after {
    height: 2px;
    width: 18px;
    top: 8px;
    left: 0;
  }

  #joystick {
    position: absolute;
    left: max(18px,env(safe-area-inset-left));
    bottom: calc(100px + var(--safe-bottom));
    width: 132px;
    height: 132px;
    border-radius: 50%;
    border: 2px solid #ffffff62;
    background: #111a254d;
    box-shadow: inset 0 0 24px #0002;
    pointer-events: auto;
    touch-action: none;
  }

  #joy-knob {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 54px;
    height: 54px;

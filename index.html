<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Minecraft Beta Clone - Mobile Portfolio Edition</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #87CEEB; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none; 
            touch-action: none; 
        }
        
        /* Interactive Crosshair Visual Anchor */
        #crosshair {
            position: fixed; 
            top: 50%; 
            left: 50%;
            width: 12px; 
            height: 12px;
            transform: translate(-50%, -50%); 
            pointer-events: none; 
            z-index: 10;
        }
        #crosshair::before, #crosshair::after { 
            content: ''; 
            position: absolute; 
            background: white; 
        }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }
        
        /* Mobile Virtual Touch Joystick Frame Layout */
        #joystick-zone {
            position: absolute; 
            bottom: 30px; 
            left: 30px;
            width: 120px; 
            height: 120px; 
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.4); 
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 20;
        }
        #joystick-knob {
            width: 50px; 
            height: 50px; 
            background: rgba(255,255,255,0.7);
            border-radius: 50%; 
            position: relative; 
            transition: transform 0.05s ease;
        }

        /* Action Command Button Overlay Layout */
        .action-box {
            position: absolute; 
            bottom: 30px; 
            right: 30px;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            z-index: 20;
        }
        .action-btn {
            width: 70px; 
            height: 70px; 
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 50%;
            color: white; 
            font-weight: bold; 
            font-size: 13px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .action-btn:active { 
            background: #00e6ff; 
            color: black; 
            border-color: #00e6ff; 
        }

        /* Onscreen Informational Dashboard overlay */
        #ui {
            position: absolute; 
            top: 15px; 
            left: 15px; 
            color: white;
            background: rgba(10, 10, 10, 0.75); 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none; 
            max-width: 260px; 
            z-index: 20;
        }
        h3 { margin: 0 0 4px 0; color: #00e6ff; font-size: 14px; text-transform: uppercase; }
        p { margin: 2px 0; font-size: 12px; color: #ccc; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="ui">
        <h3>iPad Engine Config</h3>
        <p><strong>Drag Screen:</strong> Look Around</p>
        <p><strong>Left Joystick:</strong> Walk & Move</p>
    </div>

    <!-- Movement Joystick Trigger Mechanism -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- Touch Control Action Matrix -->
    <div class="action-box">
        <div class="action-btn" id="btn-jump">JUMP</div>
        <div class="action-btn" id="btn-place">PLACE</div>
        <div class="action-btn" id="btn-break">BREAK</div>
    </div>

    <!-- Import Map Configuration Targeting Three.js Module Core via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 1. Architectural Map Constants ---
        const WORLD_WIDTH = 32;
        const WORLD_HEIGHT = 16;
        const WORLD_DEPTH = 32;
        const BLOCKS = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3 };

        const BLOCK_MATERIALS = {
            [BLOCKS.GRASS]: new THREE.MeshLambertMaterial({ color: 0x557a2b }),
            [BLOCKS.DIRT]: new THREE.MeshLambertMaterial({ color: 0x8b5a2b }),
            [BLOCKS.STONE]: new THREE.MeshLambertMaterial({ color: 0x737373 })
        };

        // --- 2. Structural Three.js Initialization ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(WORLD_WIDTH / 2, 12, WORLD_DEPTH / 2);

        // Manually tracked rotation angles optimized for touch drag configurations
        let cameraPitch = 0;
        let cameraYaw = 0;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- 3. Ambient and Direct Illumination Maps ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.75);
        sunLight.position.set(10, 30, 20);
        scene.add(sunLight);

        // --- 4. The Structural World Data Model Array ---
        const worldData = new Uint8Array(WORLD_WIDTH * WORLD_HEIGHT * WORLD_DEPTH);
        function getBlockIndex(x, y, z) { return x + (y * WORLD_WIDTH) + (z * WORLD_WIDTH * WORLD_HEIGHT); }
        
        function getBlock(x, y, z) {
            if (x < 0 || x >= WORLD_WIDTH || y < 0 || y >= WORLD_HEIGHT || z < 0 || z >= WORLD_DEPTH) return BLOCKS.AIR;
            return worldData[getBlockIndex(x, y, z)];
        }
        
        function setBlock(x, y, z, type) {
            if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT && z >= 0 && z < WORLD_DEPTH) {
                worldData[getBlockIndex(x, y, z)] = type;
            }
        }

        // Generate landscape heights via sine function logic
        for (let x = 0; x < WORLD_WIDTH; x++) {
            for (let z = 0; z < WORLD_DEPTH; z++) {
                const heightValue = Math.floor(Math.sin(x * 0.15) * Math.cos(z * 0.15) * 2) + 5;
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    if (y > heightValue) setBlock(x, y, z, BLOCKS.AIR);
                    else if (y === heightValue) setBlock(x, y, z, BLOCKS.GRASS);
                    else if (y > heightValue - 2) setBlock(x, y, z, BLOCKS.DIRT);
                    else setBlock(x, y, z, BLOCKS.STONE);
                }
            }
        }

        // --- 5. Optimized Mesh Generation & Geometry Batching ---
        let instancedMeshes = {};
        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

        function updateRenderMeshes() {
            Object.values(instancedMeshes).forEach(mesh => scene.remove(mesh));
            instancedMeshes = {};
            const counts = { [BLOCKS.GRASS]: 0, [BLOCKS.DIRT]: 0, [BLOCKS.STONE]: 0 };

            for (let x = 0; x < WORLD_WIDTH; x++) {
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    for (let z = 0; z < WORLD_DEPTH; z++) {
                        const type = getBlock(x, y, z);
                        if (type !== BLOCKS.AIR) {
                            // Check exposure status to skip unexposed inner hidden blocks
                            const exposed = getBlock(x, y+1, z) === BLOCKS.AIR || getBlock(x, y-1, z) === BLOCKS.AIR ||
                                            getBlock(x-1, y, z) === BLOCKS.AIR || getBlock(x+1, y, z) === BLOCKS.AIR ||
                                            getBlock(x, y, z-1) === BLOCKS.AIR || getBlock(x, y, z+1) === BLOCKS.AIR;
                            if (exposed) counts[type]++;
                        }
                    }
                }
            }

            Object.keys(counts).forEach(type => {
                if (counts[type] > 0) instancedMeshes[type] = new THREE.InstancedMesh(blockGeometry, BLOCK_MATERIALS[type], counts[type]);
            });

            const trackers = { [BLOCKS.GRASS]: 0, [BLOCKS.DIRT]: 0, [BLOCKS.STONE]: 0 };
            const dummy = new THREE.Object3D();

            for (let x = 0; x < WORLD_WIDTH; x++) {
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    for (let z = 0; z < WORLD_DEPTH; z++) {
                        const type = getBlock(x, y, z);
                        if (type !== BLOCKS.AIR && instancedMeshes[type]) {
                            const exposed = getBlock(x, y+1, z) === BLOCKS.AIR || getBlock(x, y-1, z) === BLOCKS.AIR ||
                                            getBlock(x-1, y, z) === BLOCKS.AIR || getBlock(x+1, y, z) === BLOCKS.AIR ||
                                            getBlock(x, y, z-1) === BLOCKS.AIR || getBlock(x, y, z+1) === BLOCKS.AIR;
                            if (!exposed) continue;
                            dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
                            dummy.updateMatrix();
                            instancedMeshes[type].setMatrixAt(trackers[type]++, dummy.matrix);
                        }
                    }
                }
            }

            Object.values(instancedMeshes).forEach(mesh => { 
Use code with caution.
mesh.instanceMatrix.needsUpdate = true;
scene.add(mesh);
});
}
updateRenderMeshes();
// --- 6. Mobile Screen Drag Look Processing ---
let lastTouchX = 0, lastTouchY = 0, isDragging = false;
window.addEventListener('touchstart', (e) => {
const touch = e.touches[0];
// Track look inputs safely outside your joystick and UI bounds
if (touch.clientX > 160 && touch.clientX < (window.innerWidth - 100)) {
isDragging = true;
lastTouchX = touch.clientX;
lastTouchY = touch.clientY;
}
});
window.addEventListener('touchmove', (e) => {
if (!isDragging) return;
const touch = e.touches[0];
const deltaX = touch.clientX - lastTouchX;
const deltaY = touch.clientY - lastTouchY;
cameraYaw -= deltaX * 0.005;
cameraPitch -= deltaY * 0.005;
cameraPitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, cameraPitch)); // Cap extreme vertical pitch limits
lastTouchX = touch.clientX;
lastTouchY = touch.clientY;
});
window.addEventListener('touchend', () => isDragging = false);
// --- 7. Onscreen Joystick Tracking Calculations ---
const joystickZone = document.getElementById('joystick-zone');
const joystickKnob = document.getElementById('joystick-knob');
let moveX = 0, moveZ = 0, joystickActive = false;
joystickZone.addEventListener('touchstart', (e) => { joystickActive = true; });
window.addEventListener('touchmove', (e) => {
if (!joystickActive) return;
const touch = Array.from(e.touches).find(t => t.target.closest('#joystick-zone'));
if (!touch) return;
const rect = joystickZone.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;
let dx = touch.clientX - centerX;
let dy = touch.clientY - centerY;
const distance = Math.min(50, Math.sqrt(dxdx + dydy));
const angle = Math.atan2(dy, dx);
dx = Math.cos(angle) * distance;
dy = Math.sin(angle) * distance;
joystickKnob.style.transform = translate(${dx}px, ${dy}px);
// Normalize inputs down into the main displacement tick tracking variables
moveX = dx / 50;
moveZ = dy / 50;
});
window.addEventListener('touchend', (e) => {
if (!e.touches.length || !Array.from(e.touches).some(t => t.target.closest('#joystick-zone'))) {
joystickActive = false;
joystickKnob.style.transform = 'translate(0px, 0px)';
moveX = 0; moveZ = 0;
}
});
// --- 8. Editing and Placement Engines (Touch Adapters) ---
const raycaster = new THREE.Raycaster();
const centerTarget = new THREE.Vector2(0, 0);
const velocity = new THREE.Vector3();
let isGrounded = false, jumpRequested = false;
document.getElementById('btn-jump').addEventListener('touchstart', () => { if (isGrounded) jumpRequested = true; });
document.getElementById('btn-place').addEventListener('touchstart', () => modifyWorld(false));
document.getElementById('btn-break').addEventListener('touchstart', () => modifyWorld(true));
function modifyWorld(destroyMode) {
raycaster.setFromCamera(centerTarget, camera);
const intersects = raycaster.intersectObjects(Object.values(instancedMeshes));
if (intersects.length > 0) {
const intersect = intersects[0];
const point = intersect.point.clone();
const normal = intersect.face.normal.clone();
if (destroyMode) {
const blockPos = point.clone().sub(normal.clone().multiplyScalar(0.5));
setBlock(Math.floor(blockPos.x), Math.floor(blockPos.y), Math.floor(blockPos.z), BLOCKS.AIR);
} else {
const blockPos = point.clone().add(normal.clone().multiplyScalar(0.5));
setBlock(Math.floor(blockPos.x), Math.floor(blockPos.y), Math.floor(blockPos.z), BLOCKS.STONE);
}
updateRenderMeshes();
}
}
// --- 9. Real-Time Application Animation Tick Loop ---
const clock = new THREE.Clock();
function animate() {
requestAnimationFrame(animate);
const dt = Math.min(clock.getDelta(), 0.1);
// Compute direct camera vector headings based on looking angles
const targetDirection = new THREE.Vector3(
Math.sin(cameraYaw) * Math.cos(cameraPitch),
Math.sin(cameraPitch),
Math.cos(cameraYaw) * Math.cos(cameraPitch)
).normalize();
camera.lookAt(camera.position.clone().add(targetDirection));
// Gravity Calculation constant impact
velocity.y -= 22.0 * dt;
// Directional translation vectors driven by the joystick values
const frontDirection = new THREE.Vector3(Math.sin(cameraYaw), 0, Math.cos(cameraYaw)).normalize();
const sideDirection = new THREE.Vector3().crossVectors(camera.up, frontDirection).normalize();
const moveVector = new THREE.Vector3();
moveVector.addScaledVector(frontDirection, -moveZ);
moveVector.addScaledVector(sideDirection, -moveX);
moveVector.multiplyScalar(4.5); // Fixed operational walking speed metric
velocity.x = moveVector.x;
velocity.z = moveVector.z;
camera.position.x += velocity.x * dt;
camera.position.z += velocity.z * dt;
camera.position.y += velocity.y * dt;
// Strict grounding spatial collision block checks
const pX = Math.floor(camera.position.x);
const pZ = Math.floor(camera.position.z);
const pY = Math.floor(camera.position.y - 1.6); // 1.6 coordinate player offset height
if (getBlock(pX, pY, pZ) !== BLOCKS.AIR) {
camera.position.y = pY + 1 + 1.6;
velocity.y = 0;
isGrounded = true;
} else {
isGrounded = false;
}
if (jumpRequested) {
velocity.y = 7.5; // Jump vertical execution lift multiplier
isGrounded = false;
jumpRequested = false;
}
renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
